
# ============================================================
# HORTASENSE — IDENTIDADE VISUAL
# ============================================================
# Tema: Cultivo Inteligente
# Paleta: Garden Matcha, Milk Foam e Mocha.
# Configuracoes exclusivamente visuais.
# ============================================================

[theme]

# Aparencia geral.
base = "light"

# Verde principal da marca.
primaryColor = "#668B4A"

# Fundo creme.
backgroundColor = "#F8F1DC"

# Superficies de formularios e controles.
secondaryBackgroundColor = "#FFFDF6"

# Texto principal.
textColor = "#27382B"

# Tipografia da interface.
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"

# Tipografia dos titulos.
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap"

baseFontSize = 15
baseFontWeight = 400

# Hierarquia tipografica.
headingFontSizes = [
    "2.35rem",
    "1.8rem",
    "1.4rem",
    "1.2rem",
    "1.05rem",
    "1rem"
]

headingFontWeights = [
    800,
    800,
    700,
    700,
    600,
    600
]

# Aparencia dos componentes.
baseRadius = "1rem"
buttonRadius = "0.8rem"

# Bordas em verde suave.
borderColor = "#D8DFC9"

showWidgetBorder = true


# ============================================================
# SIDEBAR
# ============================================================

[theme.sidebar]

# Verde profundo.
backgroundColor = "#2F5A3A"

# Verde auxiliar para superficies.
secondaryBackgroundColor = "#456D45"

# Texto claro.
textColor = "#F8F1DC"

# Destaques.
primaryColor = "#DCE8D2"


# ============================================================
# INTERFACE
# ============================================================

[client]

toolbarMode = "minimal"
